
name: readingquest_bilingual_learning
description: "ReadingQuest - Bilingual Learning Adventure for Children and Adults"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  confetti: ^0.8.0
  flutter_staggered_animations: ^1.1.1
  animate_do: ^4.2.0
  flutter_screenutil: ^5.9.3
  percent_indicator: ^4.2.3
  
  # Audio & Speech
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  speech_to_text: ^7.0.0
  
  # State Management & Navigation
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.4.9
  get_it: ^8.2.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  go_router: ^14.2.7
  
  # Storage & Database
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Authentication & Database
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  google_sign_in: ^6.2.1
 # firebase_messaging: 
  
  # Network & API
  http: ^1.2.2
  dio: ^5.4.3+1
  retrofit: ^4.6.0
  json_annotation: ^4.9.0
  
  # Payment Gateways
  flutter_stripe: ^12.0.2
  webview_flutter: ^4.4.4
  crypto: ^3.0.3
  uuid: ^4.2.2
  in_app_purchase: ^3.1.13
  
  # Utilities
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.3
  url_launcher: ^6.1.10
  package_info_plus: ^9.0.0 
  device_info_plus: ^12.1.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.4
  #get_it: ^8.0.2

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  icons_plus: ^5.0.0

  
  # Permissions
  permission_handler: ^12.0.1
  timeago: ^3.7.1
  fl_chart: ^1.1.1
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  retrofit_generator: ^10.0.5

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
    - assets/translations/
    
  # Fonts (commented out until font files are added)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
